<!DOCTYPE html>
<html lang="en">

<head>
	<title>{{ site.title }}</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />

	<!-- @todo: fill with your company info or remove -->
	<meta name="description" content="The only complete directory of Masters Basketball tournaments from around the world. Find a Masters Basketball tournament for men or women over 35 in a country near you.">
	<meta name="keywords" content="Masters,Basketball,Tournament,over 35,mature">
	<meta name="author" content="Masters Basketball Tournaments">

	{% if site.environment == 'production' %}
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-143950829-1"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'UA-143950829-1');
		</script>
	{% endif %}

	<!-- Bootstrap v4.3.1 CSS via CDN -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


	<base href="{{ site.url }}/">
	<!-- Plugins required on all pages NOTE: Additional non-required plugins are loaded ondemand as of AppStrap 2.5 -->

	<!-- Theme style -->
	<link href="assets/css/theme-style.min.css" rel="stylesheet">

	<!-- Your custom override -->
	<link href="assets/css/custom-style.css" rel="stylesheet">

	<!-- Optional: ICON SETS -->
	<!-- Iconset: Font Awesome 5.0.13 via CDN -->
	<link href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" rel="stylesheet">
	<!-- Iconset: flag icons - http://lipis.github.io/flag-icon-css/ -->
	<link href="assets/plugins/flag-icon-css/css/flag-icon.min.css" rel="stylesheet">
	<!-- Iconset: ionicons - http://ionicons.com/ -->
	<link href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet">
	<!-- Iconset: Linearicons - https://linearicons.com/free -->
	<link href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css" rel="stylesheet">
	<!-- Iconset: Lineawesome - https://icons8.com/articles/line-awesome -->
	<link href="https://maxcdn.icons8.com/fonts/line-awesome/1.1/css/line-awesome.min.css" rel="stylesheet">

	<!-- Le fav and touch icons - @todo: fill with your icons or remove, try https://realfavicongenerator.net -->
	<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico">
	<link rel="manifest" href="/favicon.ico">
	<link rel="shortcut icon" href="/favicon.ico">
	<meta name="msapplication-config" content="assets/favicons/browserconfig.xml">
	<meta name="theme-color" content="#ffffff">

	<!-- Google fonts -->
	<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700,300' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Rambla:400,700' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Calligraffitti' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,700' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Roboto:100,400,700' rel='stylesheet' type='text/css'>

	<!--Plugin: Retina.js (high def image replacement) - @see: http://retinajs.com/-->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/retina.js/1.3.0/retina.min.js"></script>

	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
</head>

{{ content }}

</html>
