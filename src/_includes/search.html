<div id="search" class="bg-white">
	<div class="bg-dark text-white p-3 p-lg-4 text-center divider-arrow divider-arrow-b divider-dark">
		<div class="container">
			<hr class="hr-lg mt-0 mb-2 w-10 mx-auto hr-primary" />

			<h2 class="text-center text-uppercase font-weight-bold my-0">
				Search
			</h2>

			<h5 class="text-center font-weight-light mt-2 mb-0 text-white op-5">
				Find a tournament near anywhere in the world
			</h5>
		</div>
	</div>

	<div class="container p-4 py-lg-6">
		<div class="row justify-content-center">
			<div class="col-lg-9 py-2">
				<i class="fa fa-wrench icon-3x text-primary" data-animate="fadeIn" data-animate-delay="0.2"></i>
				<h4 class="mt-2">
					Tournament Finder
				</h4>

				<p>Duis et persto praesent quidne roto. Consectetuer dolus odio singularis.</p>

				<form>
					<div class="form-group row">
						<label class="col-form-legend col-sm-2">Gender</label>

						<div class="col-sm-10">
							<div class="form-check">
								<label class="form-check-label">
									<input class="form-check-input" type="radio" name="gender" id="male" value="men">
									Men
								</label>
							</div>

							<div class="form-check">
								<label class="form-check-label">
									<input class="form-check-input" type="radio" name="gender" id="female" value="women">
									Women
								</label>
							</div>
						</div>
					</div>





					<div class="form-group row">
						<label class="col-sm-2">Age</label>

						<div class="col-sm-3">
							<div class="form-group">
								<select name="age" class="form-control">
									<option value="35">35+</option>
									<option value="40">40+</option>
									<option value="45">45+</option>
								</select>
							</div>
						</div>
					</div>

					<div class="form-group row">
						<label class="col-sm-2">Continent</label>

						<div class="col-sm-3">
							<div class="form-group">
								<select name="continent" class="form-control">
									<option value="America">America</option>
									<option value="Europe">Europe</option>
									<option value="Oceania">Oceania</option>
									<option value="Asia">Asia</option>
									<option value="Africa">Africa</option>
								</select>
							</div>
						</div>
					</div>

					<div class="form-group row">
						<label class="col-form-legend col-sm-2">When</label>

						<div class="col-sm-10">
							<div class="form-check">
								<label class="form-check-label">
									<input class="form-check-input" type="radio" name="when" id="male" value="men">
									Future
								</label>
							</div>

							<div class="form-check">
								<label class="form-check-label">
									<input class="form-check-input" type="radio" name="when" id="female" value="women">
									Past
								</label>
							</div>
						</div>
					</div>

					<div class="form-group row">
						<div class="offset-sm-2 col-sm-10">
							<button type="submit" class="btn btn-primary btn-xlg">Search</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
