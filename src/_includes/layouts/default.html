<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
	<title>{{ site.title }}</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="The only complete directory of Masters Basketball tournaments from around the world. Find a Masters Basketball tournament for men or women over 35 in a country near you.">
	<meta name="keywords" content="Masters,Basketball,Tournament,over 35,mature">
	<meta name="author" content="Masters Basketball Tournaments">
	{% if site.environment == 'production' %}
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-143950829-1"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'UA-143950829-1');
		</script>
	{% endif %}
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/app.css">
	<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased">
	<a href="#content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-brand-500 focus:text-white focus:px-4 focus:py-2">Skip to content</a>
	{% include 'header.html' %}
	<main id="content" class="flex-grow">
		{{ content }}
	</main>
	{% include 'footer.html' %}
	{% if datePicker %}
		<script src="/assets/js/litepicker.js"></script>
		<script src="/assets/js/date-picker.js"></script>
	{% endif %}
</body>
</html>
